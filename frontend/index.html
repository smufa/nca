<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCA Playground</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Neural Cellular Automata</h1>
        <span id="status" class="status">loading…</span>
        <span id="perf" class="perf"></span>
      </header>
      <main>
        <div class="stage">
          <div class="toolbar">
            <div class="tools" id="tools">
              <button data-tool="none" class="active" title="Inspect only">View</button>
              <button data-tool="one" title="Set pixels to 1">Set 1</button>
              <button data-tool="zero" title="Set pixels to 0">Set 0</button>
              <button data-tool="mul" title="Multiply pixels by a factor">×</button>
            </div>
            <label class="tfield">
              radius
              <input id="brushRadius" type="range" min="1" max="24" value="4" />
              <b id="brushRadiusVal">4</b>
            </label>
            <label class="tfield">
              factor
              <input id="brushFactor" type="number" step="0.1" value="0.5" />
            </label>
            <label class="tfield">
              <input id="brushAlpha" type="checkbox" />
              edit α
            </label>
            <label class="tfield">
              size
              <input id="viewSize" type="range" min="160" max="720" step="20" value="320" />
              <b id="viewSizeVal">320</b>
            </label>
            <span class="hint">edits the channels each window shows · tick α to also write channel 3</span>
          </div>
          <div id="views" class="views"></div>
        </div>
        <aside class="panel">
          <label class="field">
            <span>Model</span>
            <select id="model"></select>
          </label>

          <div class="field" id="targetField" style="display: none">
            <span>Target mix <b id="condVal"></b></span>
            <div id="condSliders" class="cond-sliders"></div>
            <button id="condReset" type="button" class="cond-reset">one-hot 0</button>
          </div>

          <label class="field">
            <span>Engine</span>
            <select id="engine">
              <option value="wasm">WASM (CPU)</option>
              <option value="shader">WebGPU (shader)</option>
            </select>
          </label>

          <label class="field">
            <span>Grid</span>
            <select id="gridSize">
              <option value="48">48 × 48</option>
              <option value="72">72 × 72 (native)</option>
              <option value="96">96 × 96</option>
              <option value="128">128 × 128</option>
              <option value="160">160 × 160</option>
              <option value="192">192 × 192</option>
              <option value="256">256 × 256</option>
            </select>
          </label>

          <div class="buttons">
            <button id="play" class="primary">Play</button>
            <button id="step">Step</button>
            <button id="reset">Reset</button>
          </div>

          <label class="field">
            <span>Speed <b id="speedVal">30</b> steps/s</span>
            <input id="speed" type="range" min="1" max="120" value="30" />
          </label>

          <button id="addView" class="wide">+ Add channel view</button>

          <details class="lab">
            <summary>Kernel lab</summary>
            <label class="field">
              <span>Angle <b id="angleVal">0°</b></span>
              <input id="angle" type="range" min="0" max="360" value="0" />
            </label>
            <div class="lab-row">
              <label class="tfield"><input id="linked" type="checkbox" checked /> linked</label>
              <label class="tfield"><input id="autoRotate" type="checkbox" /> auto-rotate</label>
            </div>
            <div id="kernelGrids" class="kernel-grids"></div>
            <button id="resetKernels" class="wide">Reset kernels</button>
          </details>

          <dl id="info" class="info"></dl>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
