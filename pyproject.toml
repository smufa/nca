[project]
name = "nca"
version = "0.1.0"
description = "Neural Cellular Automata (Growing CA, Mordvintsev et al. 2020)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.1",
    "numpy>=2.0",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "certifi>=2024.0",
]

[dependency-groups]
dev = [
    "onnx>=1.19",
    "onnxruntime>=1.24",
    "onnxscript>=0.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
